name = "mailbridge-worker"
main = "worker.js"
compatibility_date = "2026-10-21"
preview_urls = false

[vars]
MAILBRIDGE_BEHAVIOR_PROFILE = "modern"
NODE_APP_URL = "https://mailbridge.example.com/api/webhook/email"
MAIL_STORE_ENCRYPTION_VERSION = "v1"
# Re-queue stored mail after an outage longer than the queue's retries (needs the cron trigger
# below, and delivery receipts on the backend). The modern profile also keeps permanently
# rejected mail under failed/ (MAILBRIDGE_KEEP_FAILED) and stores each message's exact bytes
# (MAILBRIDGE_RAW_ENCODING = "base64").
MAILBRIDGE_SWEEP = "true"
MAILBRIDGE_SWEEP_MIN_AGE_MINUTES = "60"

[triggers]
crons = ["*/30 * * * *"]

[[r2_buckets]]
binding = "MAIL_STORE"
bucket_name = "mailbridge-inbound"

[[queues.producers]]
binding = "MAIL_QUEUE"
queue = "mailbridge-inbound"

[[queues.consumers]]
queue = "mailbridge-inbound"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "mailbridge-inbound-dead-letter"

[[send_email]]
name = "EMAIL"
