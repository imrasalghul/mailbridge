name: PR Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        if: runner.os == 'Linux'
        run: docker build --tag mailbridge-pr:${{ github.sha }} .

      - name: Verify plugin container isolation
        if: runner.os == 'Linux'
        env:
          MAILBRIDGE_TEST_DOCKER: "true"
        run: |
          node -e "require('node:child_process').execFileSync('docker', ['pull', require('./lib/plugin-process').DEFAULT_DOCKER_IMAGE], { stdio: 'inherit' })"
          node --test test/plugin-process.test.js

      - name: Validate Worker bundle
        if: runner.os == 'Linux'
        run: npx --no-install wrangler deploy --dry-run --config wrangler.example.toml
